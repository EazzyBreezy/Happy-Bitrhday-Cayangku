<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Halaman Login - Cayangg</title>
</head>

<body>
  <div class="glitter_container" id="glitterContainer"></div>

  <div class="login_container">
    <h2>Alooooo Cayanggg <br> Login dulu yaaa💗 </h2>
    <form id="loginForm" class="login_form">
      <input type="text" id="username" placeholder="Username(MyLove)" required />
      
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password(Sama dengan Username)" required />
        <i class="fa-solid fa-eye" id="togglePassword"></i>
      </div>
      
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="application/javascript" src="./scripts/index.js"></script>
</body>

</html>
